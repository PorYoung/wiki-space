# 生产/staging 拓扑（ENGINEERING 第 5 章，SDD ADR-8/12/13：6 容器 + NAS）
services:
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - web_dist:/srv/web:ro
    depends_on: [server, realtime]

  server:
    image: registry/ewiki/app:${TAG:-latest}
    command: ["node", "apps/server/dist/index.js"]
    env_file: [.env.production]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 2

  realtime:
    image: registry/ewiki/app:${TAG:-latest}
    command: ["node", "apps/realtime/dist/index.js"]
    env_file: [.env.production]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1 # Phase 1 单副本 + Caddy 粘性路由（ADR-13）

  worker:
    image: registry/ewiki/app:${TAG:-latest}
    command: ["node", "apps/worker/dist/index.js"]
    env_file: [.env.production]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ewiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ewiki}
      POSTGRES_DB: ewiki
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewiki"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ewiki}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ewiki-secret}
    volumes: [minio_data:/data]
    ports: ["9001:9001"]

volumes:
  caddy_data: {}
  caddy_config: {}
  web_dist: {}
  sites: {}
  pg_data: {}
  minio_data: {}
